name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm coverage # tests + enforces coverage thresholds
      - run: npm ci
        working-directory: fixtures/login-app
      - run: npm ci
        working-directory: fixtures/task-app
      - run: npx playwright install chromium
        working-directory: fixtures/task-app
      - run: pnpm dry-run
      - run: pnpm evals
      - run: pnpm task-e2e
